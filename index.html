<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sign Up Form</title>
</head>
<body>
    <div class="left-section">
        <div class="img-section">
            <img src="./image/odin-lined.png" alt="logo image">
            <h1>ODIN</h1>
        </div>
        <p>Photo by Rick Monteiro on Unsplash</p>
    </div>
    <div class="right-section">
        
        <div class="quote">
            <p>Never argue with stupid people, they will drag you down to their level and then beat you with experience.</p>
        </div>

        <div class="form-section">
            <p>Let's do this!</p>
            <form action="" method="post" id="my-form">
                    
                    <label for="first-name">FIRST NAME
                        <input type="text" id="first-name">            
                    </label>

                    <label for="last-name">LAST NAME
                        <input type="text" id="last-name">
                    </label>

                    <label for="email">EMAIL
                        <input type="email" id="email">
                    </label>

                    <label for="phone">PHONE NUMBER
                        <input type="tel" id="phone">
                    </label>

                    <label for="pwd">PASSWORD
                        <input type="password" id="pwd">
                    </label>

                    <label for="confirm-pwd">CONFIRM PASSWORD
                        <input type="password" id="confirm-pwd">
                    </label>
    
            </form>                   
        </div>

        <div class="submit-section">
            <button type="submit" form="my-form">Create Account</button>
            <p>Already have an account? <a href="">Log in</a></p>
        </div>

    </div>
</body>
</html>
